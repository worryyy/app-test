syntax = "proto3";

package agent.v1;

option go_package = "github.com/Milchstrassse/Ecampus-go/internal/agentchat/agentv1;agentv1";

service AgentService {
  rpc HandleTurn(HandleTurnRequest) returns (HandleTurnResponse);
  rpc StreamHandleTurn(HandleTurnRequest) returns (stream StreamHandleTurnEvent);
  rpc GetSessionHistory(GetSessionHistoryRequest) returns (GetSessionHistoryResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
}

enum Domain {
  DOMAIN_UNSPECIFIED = 0;
  DOMAIN_CHAT = 1;
  DOMAIN_MATCHMAKER = 2;
  DOMAIN_INTERVIEW = 3;
}

enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_CHAT_GENERAL = 1;
  INTENT_MATCHMAKER = 2;
  reserved 3, 4;
  reserved "INTENT_MATCHMAKER_FIND_SKILL", "INTENT_MATCHMAKER_FIND_ITEM", "INTENT_MATCHMAKER_FAQ";
  INTENT_INTERVIEW_MOCK = 5;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_FASTPATH = 1;
  MODE_GENERATE = 2;
  MODE_DEGRADED = 3;
}

enum CapabilityHint {
  CAPABILITY_HINT_UNSPECIFIED = 0;
  CAPABILITY_HINT_CHAT = 1;
  CAPABILITY_HINT_MATCHMAKER = 2;
  CAPABILITY_HINT_INTERVIEW = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_SESSION_NOT_FOUND = 3;
  ERROR_CODE_UNIMPLEMENTED_CAPABILITY = 4;
  ERROR_CODE_MODEL_TEMPORARILY_UNAVAILABLE = 5;
  ERROR_CODE_INTERNAL_DEPENDENCY_FAILURE = 6;
  ERROR_CODE_REQUEST_IN_PROGRESS = 7;
  ERROR_CODE_INTERNAL = 8;
}

message ResponseCard {
  string title = 1;
  string body = 2;
  string url = 3;
}

message Reference {
  string source = 1;
  string ref = 2;
  double score = 3;
}

message StreamStatus {
  string stage = 1;
  string message = 2;
}

message StreamDelta {
  string text = 1;
}

message StreamError {
  string message = 1;
  string trace_id = 2;
}

message StreamHandleTurnEvent {
  oneof event {
    StreamStatus status = 1;
    StreamDelta delta = 2;
    HandleTurnResponse final_response = 3;
    StreamError error = 4;
  }
}

message ConversationTurn {
  int64 sequence_no = 1;
  string role = 2;
  string content = 3;
  string created_at = 4;
  Domain domain = 5;
}

message GetSessionHistoryRequest {
  string user_id = 1;
  string session_id = 2;
  int64 before_sequence_no = 3;
  int32 limit = 4;
}

message GetSessionHistoryResponse {
  repeated ConversationTurn turns = 1;
  bool has_more = 2;
  int64 next_before_sequence_no = 3;
}

message DeleteSessionRequest {
  string user_id = 1;
  string session_id = 2;
}

message DeleteSessionResponse {
  bool deleted = 1;
}

message HandleTurnRequest {
  reserved 5, 8, 9;
  reserved "capability_hint", "capability_id", "allowed_capability_ids";

  string request_id = 1;
  string user_id = 2;
  string session_id = 3;
  string utterance = 4;
  map<string, string> metadata = 6;
  int64 deadline_ms = 7;
}

message HandleTurnResponse {
  Domain domain = 1;
  Intent intent = 2;
  Mode mode = 3;
  string answer_text = 4;
  string trace_id = 5;
  bool degraded = 6;
  string degrade_reason = 7;
  ErrorCode error_code = 8;
  repeated ResponseCard cards = 9;
  repeated Reference references = 10;
  string capability_id = 11;
}
