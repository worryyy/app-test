name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy to'
        type: choice
        default: test
        options:
          - test
          - production

permissions:
  contents: read
  packages: write

jobs:
  # ==================== Build & Push Images ====================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.prep.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image owner (lowercase)
        id: prep
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ecampus
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/ecampus/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/ecampus:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/ecampus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ecampus-crm
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/ecampus-crm/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/ecampus-crm:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/ecampus-crm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Deploy to Test ====================
  deploy-test:
    name: Deploy to Test
    needs: build
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ needs.build.outputs.owner }}
          APP_PROFILE: test
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,GHCR_OWNER,APP_PROFILE
          script: |
            echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin
            docker pull ghcr.io/$GHCR_OWNER/ecampus:latest
            docker pull ghcr.io/$GHCR_OWNER/ecampus-crm:latest
            cd /opt/ecampus/deployments
            docker compose up -d ecampus ecampus-crm

  # ==================== Deploy to Production ====================
  deploy-prod:
    name: Deploy to Production
    needs: [build, deploy-test]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ needs.build.outputs.owner }}
          APP_PROFILE: prod
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,GHCR_OWNER,APP_PROFILE
          script: |
            echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin
            docker pull ghcr.io/$GHCR_OWNER/ecampus:latest
            docker pull ghcr.io/$GHCR_OWNER/ecampus-crm:latest
            cd /opt/ecampus/deployments
            docker compose up -d ecampus ecampus-crm
