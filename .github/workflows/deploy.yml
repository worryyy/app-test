name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy to'
        type: choice
        default: test
        options:
          - test
          - production

jobs:
  # ==================== Build & Push Images ====================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ecampus
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/ecampus/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecampus:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecampus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ecampus-crm
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/ecampus-crm/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecampus-crm:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecampus-crm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Deploy to Test ====================
  deploy-test:
    name: Deploy to Test
    needs: build
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          APP_PROFILE: test
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKERHUB_USER,APP_PROFILE
          command_timeout: 5m
          script: |
            set -e
            pull_with_retry() {
              for i in 1 2 3 4 5; do
                docker pull "$1" && return 0
                echo "Retry $i: waiting 10s..."
                sleep 10
              done
              echo "Failed to pull $1 after 5 attempts"
              return 1
            }
            pull_with_retry $DOCKERHUB_USER/ecampus:latest
            pull_with_retry $DOCKERHUB_USER/ecampus-crm:latest
            docker stop campus_ecampus campus_ecampus_crm 2>/dev/null || true
            docker rm campus_ecampus campus_ecampus_crm 2>/dev/null || true
            docker run -d --name campus_ecampus \
              --network campus \
              -e APP_PROFILE=$APP_PROFILE \
              -p 8080:8080 \
              --restart unless-stopped \
              $DOCKERHUB_USER/ecampus:latest
            docker run -d --name campus_ecampus_crm \
              --network campus \
              -e APP_PROFILE=$APP_PROFILE \
              -p 8081:8081 \
              --restart unless-stopped \
              $DOCKERHUB_USER/ecampus-crm:latest

  # ==================== Deploy to Production ====================
  deploy-prod:
    name: Deploy to Production
    needs: [build, deploy-test]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          APP_PROFILE: prod
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKERHUB_USER,APP_PROFILE
          command_timeout: 5m
          script: |
            set -e
            pull_with_retry() {
              for i in 1 2 3 4 5; do
                docker pull "$1" && return 0
                echo "Retry $i: waiting 10s..."
                sleep 10
              done
              echo "Failed to pull $1 after 5 attempts"
              return 1
            }
            pull_with_retry $DOCKERHUB_USER/ecampus:latest
            pull_with_retry $DOCKERHUB_USER/ecampus-crm:latest
            docker stop campus_ecampus campus_ecampus_crm 2>/dev/null || true
            docker rm campus_ecampus campus_ecampus_crm 2>/dev/null || true
            docker run -d --name campus_ecampus \
              --network campus \
              -e APP_PROFILE=$APP_PROFILE \
              -p 8080:8080 \
              --restart unless-stopped \
              $DOCKERHUB_USER/ecampus:latest
            docker run -d --name campus_ecampus_crm \
              --network campus \
              -e APP_PROFILE=$APP_PROFILE \
              -p 8081:8081 \
              --restart unless-stopped \
              $DOCKERHUB_USER/ecampus-crm:latest
