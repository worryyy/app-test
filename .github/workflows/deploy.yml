name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy to'
        type: choice
        default: test
        options:
          - test
          - production

jobs:
  # ==================== Build & Push Images ====================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ecampus
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/ecampus/Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecampus:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecampus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ecampus-crm
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/ecampus-crm/Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecampus-crm:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecampus-crm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save images
        run: docker save ${{ secrets.DOCKERHUB_USERNAME }}/ecampus:latest ${{ secrets.DOCKERHUB_USERNAME }}/ecampus-crm:latest | gzip > /tmp/images.tar.gz

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/images.tar.gz
          retention-days: 1

  # ==================== Deploy to Test ====================
  deploy-test:
    name: Deploy to Test
    needs: build
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Transfer and deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          APP_PROFILE: test
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
          SCP="scp -i ~/.ssh/key -o StrictHostKeyChecking=no"

          $SCP /tmp/images.tar.gz $SSH_USER@$SSH_HOST:/tmp/images.tar.gz
          $SSH "gunzip -c /tmp/images.tar.gz | docker load"
          $SSH "docker stop campus_ecampus campus_ecampus_crm 2>/dev/null || true"
          $SSH "docker rm campus_ecampus campus_ecampus_crm 2>/dev/null || true"
          $SSH "docker run -d --name campus_ecampus --network campus -e APP_PROFILE=$APP_PROFILE -p 8080:8080 --restart unless-stopped $DOCKERHUB_USER/ecampus:latest"
          $SSH "docker run -d --name campus_ecampus_crm --network campus -e APP_PROFILE=$APP_PROFILE -p 8081:8081 --restart unless-stopped $DOCKERHUB_USER/ecampus-crm:latest"
          $SSH "rm -f /tmp/images.tar.gz"

  # ==================== Deploy to Production ====================
  deploy-prod:
    name: Deploy to Production
    needs: [build, deploy-test]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Transfer and deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          APP_PROFILE: prod
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
          SCP="scp -i ~/.ssh/key -o StrictHostKeyChecking=no"

          $SCP /tmp/images.tar.gz $SSH_USER@$SSH_HOST:/tmp/images.tar.gz
          $SSH "gunzip -c /tmp/images.tar.gz | docker load"
          $SSH "docker stop campus_ecampus campus_ecampus_crm 2>/dev/null || true"
          $SSH "docker rm campus_ecampus campus_ecampus_crm 2>/dev/null || true"
          $SSH "docker run -d --name campus_ecampus --network campus -e APP_PROFILE=$APP_PROFILE -p 8080:8080 --restart unless-stopped $DOCKERHUB_USER/ecampus:latest"
          $SSH "docker run -d --name campus_ecampus_crm --network campus -e APP_PROFILE=$APP_PROFILE -p 8081:8081 --restart unless-stopped $DOCKERHUB_USER/ecampus-crm:latest"
          $SSH "rm -f /tmp/images.tar.gz"
