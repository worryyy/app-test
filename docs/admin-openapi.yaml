openapi: 3.0.3
info:
  title: EcampusGO Admin API
  version: 1.0.0
  description: |
    OpenAPI document for EcampusGO admin endpoints.
    Import this file into Apifox directly.
    Actual admin prefix: /admin
    Protected endpoints require Bearer Token.
    Failed business responses usually return HTTP 400 with semantic status in body.httpstatus.
servers:
  - url: http://localhost:8081
tags:
  - name: AdminAuth
  - name: AdminUser
  - name: AdminSchool
  - name: AdminSensitive
  - name: AdminTopic
  - name: AdminComment
  - name: AdminModeration
  - name: AdminAcademic
  - name: AdminReservation
  - name: AdminMarketplace
security:
  - bearerAuth: []
paths:
  /admin/user/login:
    post:
      tags: [AdminAuth]
      summary: Admin Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginSuccessResponse'
        '400':
          description: 登录失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/refresh:
    post:
      tags: [AdminAuth]
      summary: 刷新管理员 Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRefreshSuccessResponse'
        '400':
          description: 刷新失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/logout:
    post:
      tags: [AdminAuth]
      summary: Admin Logout
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 登出失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user:
    post:
      tags: [AdminUser]
      summary: 新增用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 新增失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/{id}:
    put:
      tags: [AdminUser]
      summary: 编辑用户
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEditUserRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlySuccessResponse'
        '400':
          description: 修改失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/list:
    get:
      tags: [AdminUser]
      summary: 用户列表
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: id
          in: query
          schema:
            type: integer
            format: int64
        - name: stu_num
          in: query
          schema:
            type: string
        - name: nickname
          in: query
          schema:
            type: string
        - name: nick_name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageSuccessResponse'
        '400':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/pre_authentication:
    put:
      tags: [AdminUser]
      summary: Single Pre-Authentication
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: nick_name
          in: query
          required: true
          schema:
            type: string
        - name: pwd
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 认证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlySuccessResponse'
        '400':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/pre_authentication/batch:
    put:
      tags: [AdminUser]
      summary: Batch Pre-Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBatchPreAuthRequest'
      responses:
        '200':
          description: 处理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBatchPreAuthSuccessResponse'
        '400':
          description: 处理失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/clear:
    post:
      tags: [AdminUser]
      summary: Clear Authentication State
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIDRequest'
      responses:
        '200':
          description: 清除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 清除失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/term:
    get:
      tags: [AdminSchool]
      summary: 查询当前学期
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentTermSuccessResponse'
        '400':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [AdminSchool]
      summary: 新增学期
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermCreateRequest'
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermSuccessResponse'
        '400':
          description: 新增失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/term/list:
    get:
      tags: [AdminSchool]
      summary: 学期列表
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermListSuccessResponse'
        '400':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/term/{id}:
    delete:
      tags: [AdminSchool]
      summary: 删除学期
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 删除失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/term/cur:
    post:
      tags: [AdminSchool]
      summary: 设置当前学期
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCurrentTermRequest'
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurTermSuccessResponse'
        '400':
          description: 设置失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/sensitive/page:
    get:
      tags: [AdminSensitive]
      summary: Sensitive Words Page
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveWordPageSuccessResponse'
        '400':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/sensitive/search_like:
    get:
      tags: [AdminSensitive]
      summary: Search Sensitive Words Like
      parameters:
        - name: word
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveWordListSuccessResponse'
        '400':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/sensitive/add:
    post:
      tags: [AdminSensitive]
      summary: Add Sensitive Word
      parameters:
        - name: word
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 新增失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/sensitive/deleteByWord:
    delete:
      tags: [AdminSensitive]
      summary: Delete Sensitive Word
      parameters:
        - name: word
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 删除失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/topic:
    get:
      tags: [AdminTopic]
      summary: Admin Topic List
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPageSuccessResponse'
        '400':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [AdminTopic]
      summary: Admin Create Topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopicRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicSuccessResponse'
        '400':
          description: 创建失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/topic/{topic_id}:
    patch:
      tags: [AdminTopic]
      summary: Admin Update Topic
      parameters:
        - name: topic_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopicRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 更新失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [AdminTopic]
      summary: Admin Delete Topic
      parameters:
        - name: topic_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 删除失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/topic/{topic_id}/comment/{comment_id}:
    delete:
      tags: [AdminComment]
      summary: Admin Delete Comment
      parameters:
        - name: topic_id
          in: path
          required: true
          schema:
            type: string
        - name: comment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          description: 删除失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/moderation/reports:
    get:
      tags: [AdminModeration]
      summary: 举报列表
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - {name: status, in: query, schema: {type: string, enum: [pending, reviewing, rejected, actioned, withdrawn]}}
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/moderation/reports/{id}/claim:
    put:
      tags: [AdminModeration]
      summary: 领取举报
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/moderation/reports/{id}/decision:
    put:
      tags: [AdminModeration]
      summary: 审核举报
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: {type: string, enum: [reject, hide, warn, punish]}
                reason: {type: string, maxLength: 255}
                capability: {type: string, enum: [content, trade, reservation, account]}
                durationMinutes: {type: integer, format: int64, minimum: 1, nullable: true}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/moderation/punishments/{id}/revoke:
    put:
      tags: [AdminModeration]
      summary: 撤销处罚
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 255}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/moderation/appeals:
    get:
      tags: [AdminModeration]
      summary: 申诉列表
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/moderation/appeals/{id}/decision:
    put:
      tags: [AdminModeration]
      summary: 审批申诉
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved, resolution]
              properties:
                approved: {type: boolean}
                resolution: {type: string, maxLength: 255}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/academic/courses/{id}/merge:
    put:
      tags: [AdminAcademic]
      summary: 合并重复课程
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetCourseId]
              properties:
                targetCourseId: {$ref: '#/components/schemas/SnowflakeID'}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/academic/courses/{id}/hidden:
    put:
      tags: [AdminAcademic]
      summary: 隐藏或恢复课程
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody: {$ref: '#/components/requestBodies/HiddenRequest'}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/academic/reviews/{id}/hidden:
    put:
      tags: [AdminAcademic]
      summary: 隐藏或恢复评价
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody: {$ref: '#/components/requestBodies/HiddenRequest'}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/academic/materials/{id}/hidden:
    put:
      tags: [AdminAcademic]
      summary: 隐藏或恢复资料
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody: {$ref: '#/components/requestBodies/HiddenRequest'}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/reservation/venues:
    post:
      tags: [AdminReservation]
      summary: 创建场馆
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VenueRequest'}
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/reservation/venues/{id}/resources:
    post:
      tags: [AdminReservation]
      summary: 创建场地资源
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 128}
                capacity: {type: integer, minimum: 1, default: 1}
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/reservation/resources/{id}/rules:
    post:
      tags: [AdminReservation]
      summary: 创建每周开放规则
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekday, endMinute]
              properties:
                weekday: {type: integer, minimum: 1, maximum: 7}
                startMinute: {type: integer, minimum: 0, maximum: 1439}
                endMinute: {type: integer, minimum: 1, maximum: 1440}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/reservation/closures:
    post:
      tags: [AdminReservation]
      summary: 创建临时闭馆并取消受影响预约
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt, endAt, reason]
              properties:
                venueId: {$ref: '#/components/schemas/SnowflakeID'}
                resourceId: {$ref: '#/components/schemas/SnowflakeID'}
                startAt: {type: string, format: date-time}
                endAt: {type: string, format: date-time}
                reason: {type: string, maxLength: 255}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/reservation/checkin:
    post:
      tags: [AdminReservation]
      summary: 核销预约码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/categories:
    get:
      tags: [AdminMarketplace]
      summary: 商品类目与费率
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
    post:
      tags: [AdminMarketplace]
      summary: 创建商品类目
      requestBody: {$ref: '#/components/requestBodies/CategoryRequest'}
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/categories/{id}:
    put:
      tags: [AdminMarketplace]
      summary: 更新类目费率
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody: {$ref: '#/components/requestBodies/CategoryRequest'}
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/orders:
    get:
      tags: [AdminMarketplace]
      summary: 全部订单
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/refunds:
    get:
      tags: [AdminMarketplace]
      summary: 退款列表
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/refunds/{id}/decision:
    put:
      tags: [AdminMarketplace]
      summary: 审批全额退款
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/disputes:
    get:
      tags: [AdminMarketplace]
      summary: 纠纷列表
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/disputes/{id}/decision:
    put:
      tags: [AdminMarketplace]
      summary: 处理纠纷
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, resolution]
              properties:
                action: {type: string, enum: [resume, refund]}
                resolution: {type: string, maxLength: 255}
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/settlements:
    get:
      tags: [AdminMarketplace]
      summary: 结算记录
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200': {$ref: '#/components/responses/GenericSuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
  /admin/marketplace/settlements/{id}/retry:
    post:
      tags: [AdminMarketplace]
      summary: 重试失败结算
      parameters:
        - $ref: '#/components/parameters/SnowflakeIDPath'
      responses:
        '200': {$ref: '#/components/responses/EmptySuccess'}
        '400': {$ref: '#/components/responses/GenericError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    SizeQuery:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 15
        minimum: 1
    SnowflakeIDPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SnowflakeID'
  responses:
    GenericSuccess:
      description: 业务成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericSuccessResponse'
    EmptySuccess:
      description: 业务成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptySuccessResponse'
    GenericError:
      description: 参数或业务失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  requestBodies:
    HiddenRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [hidden]
            properties:
              hidden: {type: boolean}
    CategoryRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 64}
              commissionRateBps: {type: integer, minimum: 0, maximum: 10000, default: 500}
  schemas:
    SnowflakeID:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '1888888888888888888'
    GenericSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseMetaSuccess'
        - type: object
          properties:
            data: {}
    VenueRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 128}
        description: {type: string, maxLength: 2000}
        advanceDays: {type: integer, minimum: 1, default: 7}
        slotMinutes: {type: integer, minimum: 1, default: 60}
        dailyLimit: {type: integer, minimum: 1, default: 2}
        cancelBeforeMinutes: {type: integer, minimum: 1, default: 120}
    ResponseMetaSuccess:
      type: object
      required: [success, code, httpstatus, msg]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: integer
          example: 200
        httpstatus:
          type: integer
          example: 200
        msg:
          type: string
          example: 成功
        requestId:
          type: string
          nullable: true
    ResponseMetaError:
      type: object
      required: [success, code, httpstatus, msg]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          example: 400
        httpstatus:
          type: integer
          example: 401
        msg:
          type: string
          example: unauthorized
        requestId:
          type: string
          nullable: true
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseMetaError'
        - type: object
          properties:
            data:
              nullable: true
              example: null
    EmptySuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseMetaSuccess'
        - type: object
          properties:
            data:
              nullable: true
              example: null
    MessageOnlySuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseMetaSuccess'
        - type: object
          properties:
            data:
              nullable: true
              example: null
    AdminLoginRequest:
      type: object
      required: [username, password, secondaryPassword]
      properties:
        username:
          type: string
        password:
          type: string
        secondaryPassword:
          type: string
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    UserIDRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        avatar:
          type: string
        power:
          type: integer
        accountType:
          type: string
          enum: [base, anonymous]
        stuNum:
          type: string
        stuName:
          type: string
        stuPwd:
          type: string
        stuCla:
          type: string
        stuIsCheck:
          type: boolean
        school:
          type: string
        tag:
          type: string
        gender:
          type: string
        rootUserId:
          type: integer
          format: int64
        lastSwitchId:
          type: integer
          format: int64
          nullable: true
        signature:
          type: string
    UserCreateRequest:
      type: object
      properties:
        nickname:
          type: string
        avatar:
          type: string
        power:
          type: integer
        accountType:
          type: string
          enum: [base, anonymous]
        stuNum:
          type: string
        stuName:
          type: string
        stuPwd:
          type: string
        stuCla:
          type: string
        stuIsCheck:
          type: boolean
        school:
          type: string
        tag:
          type: string
        gender:
          type: string
        rootUserId:
          type: integer
          format: int64
        lastSwitchId:
          type: integer
          format: int64
          nullable: true
        signature:
          type: string
    AdminEditUserRequest:
      type: object
      properties:
        nickname:
          type: string
        avatar:
          type: string
        power:
          type: integer
          nullable: true
        stuNum:
          type: string
        stuName:
          type: string
        stuCla:
          type: string
        stuIsCheck:
          type: boolean
          nullable: true
    UserPageResult:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          format: int64
        current:
          type: integer
        size:
          type: integer
        pages:
          type: integer
        orders:
          type: array
          items: {}
        optimizeCountSql:
          type: boolean
        searchCount:
          type: boolean
        countId:
          type: integer
          nullable: true
        maxLimit:
          type: integer
          nullable: true
    AdminLoginData:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    AdminRefreshData:
      type: object
