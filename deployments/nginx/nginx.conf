user nginx-user;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections  4096;  # 高并发场景调整
    use epoll;
    multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 20M;  # 文件上传大小限制

        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;
        ssl_certificate /etc/nginx/ssl/sztuxyez.top_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/sztuxyez.top.key;

        ##
        # Logging Settings
        ##
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        ##
        # Gzip Settings
        ##

        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;


        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;


server {
        listen 80;
        server_name sztuxyez.top;

        location / {
            return 301 https://$host$request_uri;
        }
}

server {
       listen 443 ssl default_server;
       server_name www.sztuxyez.top;
       root /usr/share/nginx/f_admin;
       index index.html;


       ssl_certificate /etc/nginx/ssl/sztuxyez.top_bundle.crt;
       ssl_certificate_key /etc/nginx/ssl/sztuxyez.top.key;

       ssl_session_timeout 5m;
       ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
       ssl_protocols TLSv1.2 TLSv1.3;

       ssl_prefer_server_ciphers on;
       location / {
          index index.html index.htm;
          try_files $uri $uri/ /index.html;
       }

        # 用户端 API → ecampus (8080)
        location /api/ {
                proxy_pass http://127.0.0.1:8080/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 管理端 API → ecampus-crm (8081)
        location /admin/ {
                proxy_pass http://127.0.0.1:8081/admin/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /file/ {
                proxy_pass http://127.0.0.1:8080/file/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /sztu_jw/ {
            proxy_pass http://127.0.0.1:8888/sztu_jw/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket 支持配置 - 处理 /chat 路径的 WebSocket 连接
        location /chat {
            proxy_pass http://127.0.0.1:8080/chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;  # 24小时超时，适合长连接
            proxy_send_timeout 86400;
        }

        location /images/ {
            alias /usr/share/nginx/images/;
            autoindex off;
            expires 30d;
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ =404;
        }



        location ~* /font/.*\.(ttf)$ {
                root /usr/share/nginx;
                add_header Content-Type font/ttf;
                add_header Access-Control-Allow-Origin *;
        }

}
}
