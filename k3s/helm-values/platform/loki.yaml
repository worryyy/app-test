# Experimental logging backend for the dev cluster: Monolithic single replica
# with filesystem storage and 7-day retention. Grafana positions this mode for
# testing/development and small installations; HA (multiple replicas or an
# object store) is intentionally out of scope.
#
# Currently set to 0 replicas: the benchmark cluster needs node3 memory for
# the CI build pod, and the Monolithic chart's memcached caches/canary come
# with large default requests. Logging is not on the benchmark critical path;
# re-enable by setting singleBinary.replicas back to 1 and the caches true.
deploymentMode: Monolithic

singleBinary:
  replicas: 0
  nodeSelector:
    platform-role: light
  persistence:
    enabled: true
    size: 6Gi

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

test:
  enabled: false

monitoring:
  lokiCanary:
    enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    retention_period: 168h
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-08-02"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

gateway:
  enabled: false

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

networkPolicy:
  enabled: true
  ingress:
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
    podSelector:
      app.kubernetes.io/name: alloy
  metrics:
    # Kubelet liveness/readiness probes originate from the cluster nodes.
    cidrs:
      - 100.80.235.120/32
      - 100.99.235.70/32
      - 100.83.57.72/32
