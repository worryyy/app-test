# P1 平台骨架：单副本 MinIO（制品/报告/快照对象存储）。
mode: standalone

image:
  repository: docker.1ms.run/minio/minio
  tag: "RELEASE.2026-09-01T00-00-00Z"

mcImage:
  repository: docker.1ms.run/minio/mc
  tag: latest

# root 凭据走 Secret，不落 values。
existingSecret: platform-minio-auth

persistence:
  enabled: true
  size: 20Gi
  storageClass: local-path

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

nodeSelector:
  platform-role: light

metrics:
  serviceMonitor:
    enabled: false
